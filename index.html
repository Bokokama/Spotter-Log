<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>れじあつめ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- PWA用マニフェスト ＆ 設定 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <style>
    :root {
      --bg-color: #121212;
      /* 未収集の背景色をダークグレーに設定 */
      --card-bg: #1e1e1e;
      --card-border: #27272a;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-purple: #6366f1;
      /* 収集済の背景色を黒に設定 */
      --card-collected-bg: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; max-width: 600px; margin: 0 auto; }

    .header { margin-bottom: 8px; position: relative; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; }
    
    .hamburger-btn {
      background: #1e1e1e;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .hamburger-btn:active { background: #27272a; }

    .menu-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 44px;
      background: #1e1e1e;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      width: 200px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 50;
      padding: 6px;
    }
    .menu-dropdown.show { display: block; }
    .menu-item {
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
    }
    .menu-item:hover { background: #27272a; }
    .menu-divider { height: 1px; background: var(--card-border); margin: 4px 0; }

    /* 進捗表示：タイトルのすぐ下 */
    .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .stat-box { background: #1e1e1e; padding: 8px 4px; border-radius: 8px; text-align: center; border: 1px solid var(--card-border); }
    .stat-value { font-size: 1.1rem; font-weight: 700; }
    .stat-label { font-size: 0.65rem; color: var(--text-sub); margin-top: 2px; }

    /* 検索窓 */
    .search-box { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border); background: #1e1e1e; color: #fff; margin-bottom: 8px; font-size: 0.95rem; }
    
    /* 抽出タブエリア（2系統の独立フィルタ ＋ 縦線セパレーター） */
    .filter-container { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
    .filter-group { display: flex; gap: 6px; flex-shrink: 0; }
    
    .filter-separator {
      width: 1px;
      height: 20px;
      background-color: var(--card-border);
      flex-shrink: 0;
      margin: 0 2px;
    }

    .filter-btn { padding: 4px 10px; border-radius: 14px; border: 1px solid var(--card-border); background: #1e1e1e; color: var(--text-sub); font-size: 0.8rem; cursor: pointer; white-space: nowrap; font-weight: 500; flex-shrink: 0; }
    .filter-btn.active { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

    /* パンくずリスト（レジカード一覧のすぐ上） */
    .nav-bar { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
    .nav-item { cursor: pointer; font-weight: 600; flex-shrink: 0; }
    .nav-item.active { color: var(--text-main); font-weight: 700; }
    .nav-arrow { font-size: 0.8rem; color: #52525b; flex-shrink: 0; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    .card {
      background: var(--card-bg);
      color: var(--text-main);
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      border: 1px solid var(--card-border);
      transition: transform 0.1s, background 0.2s;
    }
    .card:active { transform: scale(0.96); }

    .card.collected {
      background: var(--card-collected-bg);
      color: #ffffff;
      border-color: #3f3f46;
    }

    .card-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .airline-model {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .collected-box {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      font-weight: 800;
      font-size: 11px;
      border: 1.5px solid var(--accent-purple);
    }

    .card-row-center {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
      width: 100%;
      text-align: center;
    }
    .folder-title-code {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    .card-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 12px;
      min-height: 16px;
    }
    .folder-count-text { color: #9ca3af; font-weight: 600; }
    .folder-rate-badge { color: #818cf8; font-weight: 700; }
    .livery-text { color: #818cf8; font-weight: 700; font-size: 11px; }
    .flyteam-badge { color: #818cf8; text-decoration: none; font-weight: 700; }
    .flyteam-badge:hover { text-decoration: underline; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 100; }
    .modal { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; border: 1px solid var(--card-border); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 1.2rem; font-weight: 700; }
    
    .btn-reset {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid var(--accent-purple);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-reset:hover { background: rgba(99, 102, 241, 0.3); }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 0.85rem; color: var(--text-sub); display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: 500; }
    .form-input { width: 100%; padding: 10px; background: #121212; border: 1px solid var(--card-border); border-radius: 6px; color: #fff; font-size: 0.95rem; }
    
    textarea.form-input {
      resize: none;
      height: 72px;
      line-height: 1.4;
    }

    .status-toggle-single {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #262626;
      color: var(--text-sub);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .status-toggle-single.active {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-purple);
    }

    .btn-group { display: flex; gap: 8px; margin-top: 18px; }
    .btn { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--accent-purple); color: #fff; }
    .btn-secondary { background: var(--card-border); color: var(--text-main); }
    .flyteam-link { display: inline-block; margin-top: 6px; color: #818cf8; font-size: 0.85rem; text-decoration: none; font-weight: 600; }

    .hidden-file { display: none; }
  </style>
</head>
<body>

  <!-- 1. タイトル ＆ ハンバーガーメニュー -->
  <div class="header">
    <div class="top-bar">
      <div class="title" id="page-title">REJI ATSUME <span style="font-size:0.75rem; color:var(--text-sub); font-weight:500;">れじあつめ v2.51</span></div>
      
      <div style="position:relative;">
        <button class="hamburger-btn" id="hamburger-toggle">≡</button>
        <div class="menu-dropdown" id="menu-dropdown">
          <div class="menu-item" onclick="triggerCsvImport()">CSVマスタ読込</div>
          <div class="menu-divider"></div>
          <div class="menu-item" onclick="exportJson()">JSONデータ書出</div>
          <div class="menu-item" onclick="triggerJsonImport()">JSONデータ読込</div>
        </div>
      </div>
    </div>

    <!-- 2. 進捗表示 -->
    <div class="stats-container">
      <div class="stat-box">
        <div class="stat-value" id="stat-collected">0</div>
        <div class="stat-label">COLLECTED</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label" id="stat-total-label">AIRCRAFT</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-rate">0%</div>
        <div class="stat-label">COMPLETE</div>
      </div>
    </div>
  </div>

  <input type="file" id="csv-file-input" class="hidden-file" accept=".csv,text/csv,text/plain,application/vnd.ms-excel,*/*" onchange="handleCsvImport(event)">
  <input type="file" id="json-file-input" class="hidden-file" accept=".json,application/json,*/*" onchange="handleJsonImport(event)">

  <!-- 3. 検索窓 -->
  <input type="text" class="search-box" id="search-input" placeholder="検索（レジ名・機種・航空会社・特別塗装名など）">
  
  <!-- 4. 抽出タブ（独立した2グループ ＋ 縦線セパレーター） -->
  <div class="filter-container">
    <!-- 収集状態グループ（C / U に短縮） -->
    <div class="filter-group" id="group-collection">
      <button class="filter-btn active" data-collection="all">すべて</button>
      <button class="filter-btn" data-collection="collected">C</button>
      <button class="filter-btn" data-collection="uncollected">U</button>
    </div>

    <div class="filter-separator"></div>

    <!-- 属性グループ -->
    <div class="filter-group" id="group-attribute">
      <button class="filter-btn active" data-attribute="all">すべて</button>
      <button class="filter-btn" data-attribute="livery">特別塗装</button>
      <button class="filter-btn" data-attribute="active">現役</button>
      <button class="filter-btn" data-attribute="planned">予約</button>
      <button class="filter-btn" data-attribute="retired">退役</button>
    </div>
  </div>

  <!-- 5. パンくずリスト（レジカード一覧のすぐ上） -->
  <div class="nav-bar" id="breadcrumb"></div>

  <!-- 6. レジカード一覧 -->
  <div class="grid" id="content-area"></div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-reg">JA000A</div>
        <button type="button" class="btn-reset" id="modal-reset">リセット</button>
      </div>
      
      <div class="form-group">
        <label class="form-label">撮影ステータス</label>
        <div class="status-toggle-single" id="status-toggle-btn" onclick="toggleStatus()">
          未撮影 (タップして撮影済に切り替え)
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">FlyTeam URL</label>
        <input type="url" class="form-input" id="modal-url" placeholder="https://flyteam.jp/photo/...">
        <a href="#" target="_blank" class="flyteam-link" id="modal-flyteam-open" style="display:none;">FlyTeamページを開く</a>
      </div>

      <div class="form-group">
        <label class="form-label">
          <span>メモ</span>
          <span id="memo-counter" style="color:var(--text-sub); font-size:0.75rem;">0 / 64文字</span>
        </label>
        <textarea class="form-input" id="modal-memo" maxlength="64" placeholder="例: 特別塗装、レドーム等"></textarea>
      </div>
      
      <div class="btn-group">
        <button class="btn btn-secondary" id="modal-cancel">キャンセル</button>
        <button class="btn btn-primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <script>
    // Service Worker 登録処理
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('SW registered: ', reg))
          .catch((err) => console.log('SW registration failed: ', err));
      });
    }

    let masterData = JSON.parse(localStorage.getItem('rejiatsume_master') || JSON.stringify([
      { status: 'Active', reg: 'JA605A', airline: 'ADO', icao4: 'B763', livery: '', liveryName: '', remarks: '' },
      { status: 'Active', reg: 'JA607A', airline: 'ADO', icao4: 'B763', livery: 'Current', liveryName: 'ロコンジェット北海道', remarks: '' },
      { status: 'Active', reg: 'JA612A', airline: 'ADO', icao4: 'B763', livery: '', liveryName: '', remarks: '' },
      { status: 'Active', reg: 'JA613A', airline: 'ADO', icao4: 'B763', livery: '', liveryName: '', remarks: '元ANA' },
      { status: 'Active', reg: 'JA07AN', airline: 'ADO', icao4: 'B737', livery: '', liveryName: '', remarks: '元ANA' }
    ]));

    let userData = JSON.parse(localStorage.getItem('rejiatsume_userdata') || '{}');
    
    let currentAirline = null;
    let currentModel = null;
    
    // 独立した2つのフィルタ状態
    let currentCollectionFilter = 'all';
    let currentAttributeFilter = 'all';
    
    let currentEditingReg = null;
    let tempCollectedState = false;

    const hamburgerBtn = document.getElementById('hamburger-toggle');
    const menuDropdown = document.getElementById('menu-dropdown');

    hamburgerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle('show');
    });

    document.addEventListener('click', (e) => {
      if (!menuDropdown.contains(e.target) && e.target !== hamburgerBtn) {
        menuDropdown.classList.remove('show');
      }
    });

    function triggerCsvImport() {
      menuDropdown.classList.remove('show');
      document.getElementById('csv-file-input').click();
    }

    function handleCsvImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        parseCsv(e.target.result);
      };
      reader.readAsText(file, 'UTF-8');
      event.target.value = '';
    }

    function parseCsvLine(textLine) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < textLine.length; i++) {
        const char = textLine[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result.map(c => c.replace(/^["']|["']$/g, ''));
    }

    function parseCsv(text) {
      const lines = text.split(/\r\n|\n/);
      const newMaster = [];

      let headerMap = { status: 0, reg: 1, airline: 2, icao4: 3, model: 4, livery: 6, liveryName: 7, remarks: 8 };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        
        const cols = parseCsvLine(line);

        if (i === 0 && (cols[0].toLowerCase() === 'status' || cols[1].toLowerCase() === 'registration' || cols[1].toLowerCase() === 'レジ')) {
          cols.forEach((colName, idx) => {
            const low = colName.toLowerCase();
            if (low.includes('status')) headerMap.status = idx;
            if (low.includes('registration') || low.includes('レジ')) headerMap.reg = idx;
            if (low.includes('airline') || low.includes('航空会社')) headerMap.airline = idx;
            if (low.includes('icao4')) headerMap.icao4 = idx;
            if (low.includes('model') || low.includes('機種')) headerMap.model = idx;
            if (low.includes('livery') && !low.includes('name')) headerMap.livery = idx;
            if (low.includes('livery name')) headerMap.liveryName = idx;
            if (low.includes('remarks') || low.includes('備考')) headerMap.remarks = idx;
          });
          continue;
        }

        const status = cols[headerMap.status] || 'Active';
        const reg = (cols[headerMap.reg] || '').toUpperCase();
        const airline = (cols[headerMap.airline] || '').toUpperCase();
        const icao4 = (cols[headerMap.icao4] || cols[headerMap.model] || '').toUpperCase();
        const livery = cols[headerMap.livery] || '';
        const liveryName = cols[headerMap.liveryName] || '';
        const remarks = cols[headerMap.remarks] || '';

        if (reg && airline) {
          newMaster.push({ status, reg, airline, icao4, livery, liveryName, remarks });
        }
      }

      if (newMaster.length > 0) {
        masterData = newMaster;
        localStorage.setItem('rejiatsume_master', JSON.stringify(masterData));
        currentAirline = null;
        currentModel = null;
        currentCollectionFilter = 'all';
        currentAttributeFilter = 'all';
        
        document.querySelectorAll('#group-collection .filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('#group-collection .filter-btn[data-collection="all"]').classList.add('active');
        document.querySelectorAll('#group-attribute .filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('#group-attribute .filter-btn[data-attribute="all"]').classList.add('active');
        
        render();
        alert(`CSVから ${newMaster.length} 件のマスタデータを正常に読み込みました！`);
      } else {
        alert('有効なCSVデータが見つかりませんでした。フォーマットを確認してください。');
      }
    }

    function exportJson() {
      menuDropdown.classList.remove('show');
      const exportData = {
        masterData: masterData,
        userData: userData,
        version: "2.51",
        date: new Date().toISOString()
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `rejiatsume_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerJsonImport() {
      menuDropdown.classList.remove('show');
      document.getElementById('json-file-input').click();
    }

    function handleJsonImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const json = JSON.parse(e.target.result);
          if (json.userData) {
            userData = json.userData;
            localStorage.setItem('rejiatsume_userdata', JSON.stringify(userData));
          }
          if (json.masterData && Array.isArray(json.masterData)) {
            masterData = json.masterData;
            localStorage.setItem('rejiatsume_master', JSON.stringify(masterData));
          }
          currentAirline = null;
          currentModel = null;
          render();
          alert('JSONバックアップデータを正常に復元しました！');
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。ファイルが破損している可能性があります。');
        }
      };
      reader.readAsText(file, 'UTF-8');
      event.target.value = '';
    }

    function saveData() {
      localStorage.setItem('rejiatsume_userdata', JSON.stringify(userData));
      render();
    }

    // 2つのフィルタ条件の組み合わせ（AND検索）判定
    function matchFilter(item) {
      const isCollected = !!(userData[item.reg] && userData[item.reg].collected);
      const statLower = (item.status || '').toLowerCase();
      const hasLivery = item.livery && item.livery.trim() !== '' && item.livery.toLowerCase() !== 'nan';

      let matchCol = true;
      if (currentCollectionFilter === 'collected') matchCol = isCollected;
      else if (currentCollectionFilter === 'uncollected') matchCol = !isCollected;

      let matchAttr = true;
      if (currentAttributeFilter === 'livery') matchAttr = hasLivery;
      else if (currentAttributeFilter === 'active') matchAttr = (statLower === 'active');
      else if (currentAttributeFilter === 'planned') matchAttr = (statLower === 'planned');
      else if (currentAttributeFilter === 'retired') matchAttr = (statLower === 'retired');

      return matchCol && matchAttr;
    }

    function render() {
      renderBreadcrumb();
      const searchVal = document.getElementById('search-input').value.toUpperCase().trim();

      if (searchVal !== '') {
        renderSearchResults(searchVal);
      } else if (!currentAirline) {
        renderAirlineGrid();
      } else if (currentAirline && !currentModel) {
        renderModelGrid();
      } else {
        renderRegGrid();
      }
    }

    // パンくずリストおよび階層の連動処理（検索経由のジャンプにも対応）
    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      nav.innerHTML = '';

      const searchVal = document.getElementById('search-input').value.trim();
      const isSearching = searchVal !== '';

      const top = document.createElement('span');
      top.className = `nav-item ${!isSearching && !currentAirline ? 'active' : ''}`;
      top.innerText = 'TOP (AIRLINE)';
      top.onclick = () => {
        document.getElementById('search-input').value = '';
        currentAirline = null;
        currentModel = null;
        render();
      };
      nav.appendChild(top);

      if (isSearching) {
        const arrow = document.createElement('span');
        arrow.className = 'nav-arrow';
        arrow.innerText = '>';
        nav.appendChild(arrow);

        const searchItem = document.createElement('span');
        searchItem.className = 'nav-item active';
        searchItem.innerText = `検索: "${searchVal}"`;
        nav.appendChild(searchItem);
        return;
      }

      if (currentAirline) {
        const arrow1 = document.createElement('span');
        arrow1.className = 'nav-arrow';
        arrow1.innerText = '>';
        nav.appendChild(arrow1);

        const airItem = document.createElement('span');
        airItem.className = `nav-item ${currentAirline && !currentModel ? 'active' : ''}`;
        airItem.innerText = currentAirline;
        airItem.onclick = () => { currentModel = null; render(); };
        nav.appendChild(airItem);
      }

      if (currentModel) {
        const arrow2 = document.createElement('span');
        arrow2.className = 'nav-arrow';
        arrow2.innerText = '>';
        nav.appendChild(arrow2);

        const modItem = document.createElement('span');
        modItem.className = 'nav-item active';
        modItem.innerText = currentModel;
        nav.appendChild(modItem);
      }
    }

    function updateStats(scopeItems) {
      const filteredScope = scopeItems.filter(matchFilter);
      const total = filteredScope.length;

      let collected = 0;
      filteredScope.forEach(item => {
        if (userData[item.reg] && userData[item.reg].collected) collected++;
      });
      const rate = total > 0 ? Math.round((collected / total) * 100) : 0;

      document.getElementById('stat-collected').innerText = collected;
      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-rate').innerText = rate + '%';

      const labelElem = document.getElementById('stat-total-label');
      if (currentAttributeFilter === 'active') labelElem.innerText = 'ACTIVE';
      else if (currentAttributeFilter === 'planned') labelElem.innerText = 'PLANNED';
      else if (currentAttributeFilter === 'retired') labelElem.innerText = 'RETIRED';
      else if (currentAttributeFilter === 'livery') labelElem.innerText = 'LIVERY';
      else labelElem.innerText = 'AIRCRAFT';
    }

    function renderAirlineGrid() {
      const container = document.getElementById('content-area');
      container.innerHTML = '';

      updateStats(masterData);

      const airlines = [...new Set(masterData.map(item => item.airline))];

      airlines.forEach(airline => {
        const airlineItems = masterData.filter(item => item.airline === airline);
        const filteredItems = airlineItems.filter(matchFilter);
        
        if (filteredItems.length === 0 && (currentCollectionFilter !== 'all' || currentAttributeFilter !== 'all')) return;

        const total = filteredItems.length;
        let collected = 0;
        filteredItems.forEach(item => {
          if (userData[item.reg] && userData[item.reg].collected) collected++;
        });
        const rate = total > 0 ? Math.round((collected / total) * 100) : 0;
        const isComplete = collected === total && total > 0;

        const card = document.createElement('div');
        card.className = `card ${isComplete ? 'collected' : ''}`;
        card.onclick = () => {
          currentAirline = airline;
          render();
        };

        const boxHtml = isComplete ? `<span class="collected-box">C</span>` : '';

        card.innerHTML = `
          <div class="card-row-top">
            <span class="airline-model">AIRLINE</span>
            ${boxHtml}
          </div>
          <div class="card-row-center">
            <span class="folder-title-code">${airline}</span>
          </div>
          <div class="card-row-bottom">
            <span class="folder-count-text">${collected}/${total}</span>
            <span class="folder-rate-badge">${rate}%</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderModelGrid() {
      const container = document.getElementById('content-area');
      container.innerHTML = '';

      const airlineItems = masterData.filter(item => item.airline === currentAirline);
      updateStats(airlineItems);

      const models = [...new Set(airlineItems.map(item => item.icao4))];

      models.forEach(model => {
        const modelItems = airlineItems.filter(item => item.icao4 === model);
        const filteredItems = modelItems.filter(matchFilter);

        if (filteredItems.length === 0 && (currentCollectionFilter !== 'all' || currentAttributeFilter !== 'all')) return;

        const total = filteredItems.length;
        let collected = 0;
        filteredItems.forEach(item => {
          if (userData[item.reg] && userData[item.reg].collected) collected++;
        });
        const rate = total > 0 ? Math.round((collected / total) * 100) : 0;
        const isComplete = collected === total && total > 0;

        const card = document.createElement('div');
        card.className = `card ${isComplete ? 'collected' : ''}`;
        card.onclick = () => {
          currentModel = model;
          render();
        };

        const boxHtml = isComplete ? `<span class="collected-box">C</span>` : '';

        card.innerHTML = `
          <div class="card-row-top">
            <span class="airline-model">${currentAirline}</span>
            ${boxHtml}
          </div>
          <div class="card-row-center">
            <span class="folder-title-code">${model}</span>
          </div>
          <div class="card-row-bottom">
            <span class="folder-count-text">${collected}/${total}</span>
            <span class="folder-rate-badge">${rate}%</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRegGrid() {
      const container = document.getElementById('content-area');
      container.innerHTML = '';

      const targetItems = masterData.filter(item => item.airline === currentAirline && item.icao4 === currentModel);
      updateStats(targetItems);

      const filtered = targetItems.filter(matchFilter);

      filtered.forEach(item => {
        container.appendChild(createRegCard(item));
      });
    }

    function renderSearchResults(searchVal) {
      const container = document.getElementById('content-area');
      container.innerHTML = '';

      const filtered = masterData.filter(item => {
        if (!matchFilter(item)) return false;
        const u = userData[item.reg] || {};
        return item.reg.toUpperCase().includes(searchVal) || 
               item.icao4.toUpperCase().includes(searchVal) || 
               item.airline.toUpperCase().includes(searchVal) ||
               (item.liveryName && item.liveryName.toUpperCase().includes(searchVal)) ||
               (item.remarks && item.remarks.toUpperCase().includes(searchVal)) ||
               (u.memo && u.memo.toUpperCase().includes(searchVal));
      });

      updateStats(filtered);

      filtered.forEach(item => {
        container.appendChild(createRegCard(item));
      });
    }

    function createRegCard(item) {
      const u = userData[item.reg] || { collected: false, url: '', memo: '' };
      const isCollected = !!u.collected;
      const hasUrl = !!(u.url && u.url.trim() !== '');
      const hasLivery = item.livery && item.livery.trim() !== '' && item.livery.toLowerCase() !== 'nan';

      const card = document.createElement('div');
      card.className = `card ${isCollected ? 'collected' : ''}`;
      
      // 検索結果からカードをタップした際、パンくずや階層を自動連動させる
      card.onclick = () => {
        const searchInput = document.getElementById('search-input');
        if (searchInput.value.trim() !== '') {
          searchInput.value = '';
          currentAirline = item.airline;
          currentModel = item.icao4;
        }
        openModal(item.reg);
      };

      const boxHtml = isCollected ? `<span class="collected-box">C</span>` : '';
      const topHtml = `
        <div class="card-row-top">
          <span class="airline-model">${item.airline} ${item.icao4}</span>
          ${boxHtml}
        </div>
      `;

      const centerHtml = `
        <div class="card-row-center">
          <span class="folder-title-code">${item.reg}</span>
        </div>
      `;

      const liveryDisplay = hasLivery ? `<span class="livery-text" style="font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70px;">${item.liveryName || 'Livery'}</span>` : '<span></span>';
      const flyteamHtml = hasUrl ? `<a href="${u.url}" target="_blank" onclick="event.stopPropagation();" class="flyteam-badge">FlyTeam</a>` : '<span></span>';
      
      const bottomHtml = `
        <div class="card-row-bottom">
          ${liveryDisplay}
          ${flyteamHtml}
        </div>
      `;

      card.innerHTML = topHtml + centerHtml + bottomHtml;
      return card;
    }

    function toggleStatus() {
      tempCollectedState = !tempCollectedState;
      updateToggleBtnDisplay();
    }

    function updateToggleBtnDisplay() {
      const btn = document.getElementById('status-toggle-btn');
      if (tempCollectedState) {
        btn.classList.add('active');
        btn.innerText = '撮影済 (C)';
      } else {
        btn.classList.remove('active');
        btn.innerText = '未撮影 (タップして撮影済に切り替え)';
      }
    }

    function openModal(reg) {
      currentEditingReg = reg;
      const u = userData[reg] || { collected: false, url: '', memo: '' };
      
      document.getElementById('modal-reg').innerText = reg;
      document.getElementById('modal-url').value = u.url || '';
      
      const memoArea = document.getElementById('modal-memo');
      memoArea.value = u.memo || '';
      updateMemoCounter(memoArea.value.length);

      tempCollectedState = !!u.collected;
      updateToggleBtnDisplay();

      const linkBtn = document.getElementById('modal-flyteam-open');
      if (u.url) {
        linkBtn.href = u.url;
        linkBtn.style.display = 'inline-block';
      } else {
        linkBtn.style.display = 'none';
      }

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    const memoInput = document.getElementById('modal-memo');
    memoInput.oninput = (e) => {
      updateMemoCounter(e.target.value.length);
    };

    function updateMemoCounter(len) {
      document.getElementById('memo-counter').innerText = `${len} / 64文字`;
    }

    document.getElementById('modal-reset').onclick = () => {
      if (confirm(`${currentEditingReg} の記録をリセットしますか？`)) {
        delete userData[currentEditingReg];
        saveData();
        document.getElementById('modal-overlay').style.display = 'none';
      }
    };

    document.getElementById('modal-cancel').onclick = () => {
      document.getElementById('modal-overlay').style.display = 'none';
    };

    document.getElementById('modal-save').onclick = () => {
      const url = document.getElementById('modal-url').value.trim();
      const memo = document.getElementById('modal-memo').value.trim();

      userData[currentEditingReg] = {
        collected: tempCollectedState,
        url: url,
        memo: memo
      };

      saveData();
      document.getElementById('modal-overlay').style.display = 'none';
    };

    // 収集状態グループのボタンクリックイベント
    document.querySelectorAll('#group-collection .filter-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('#group-collection .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCollectionFilter = e.target.dataset.collection;
        render();
      };
    });

    // 属性グループのボタンクリックイベント
    document.querySelectorAll('#group-attribute .filter-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('#group-attribute .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentAttributeFilter = e.target.dataset.attribute;
        render();
      };
    });

    document.getElementById('search-input').oninput = render;

    render();
  </script>
</body>
</html>
